<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
      name="description"
      content="Contacto de Mueblería Hermanos Jota."
    >
    <title>Contacto | Mueblería Hermanos Jota</title>
    <link rel="stylesheet" href="style.css">
  </head>

  <body>
    <header>
      <a href="index.html">
        <img
          src="imagenes/logo.svg"
          alt="Mueblería Hermanos Jota"
          width="180"
          height="180"
        >
      </a>

      <nav aria-label="Navegación principal">
        <ul>
          <li><a href="index.html">Inicio</a></li>
          <li><a href="productos.html">Productos</a></li>
          <li>
            <a href="#">Carrito (<span id="contador-carrito">0</span>)</a>
          </li>
          <li><a href="contacto.html">Contacto</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section aria-labelledby="titulo-contacto">
        <h1 id="titulo-contacto">Contacto</h1>

        <form id="formulario-contacto">
          <div>
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre">
          </div>

          <div>
            <label for="email">Email</label>
            <input type="email" id="email" name="email">
          </div>

          <div>
            <label for="mensaje">Mensaje</label>
            <textarea id="mensaje" name="mensaje" rows="6"></textarea>
          </div>

          <button type="submit">Enviar mensaje</button>
        </form>

        <div id="mensaje-exito" aria-live="polite"></div>
      </section>
    </main>

    <footer>
      <p><strong>Mueblería Hermanos Jota</strong></p>
      <p>
        <small>&copy; 2026 Mueblería Hermanos Jota.</small>
      </p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
